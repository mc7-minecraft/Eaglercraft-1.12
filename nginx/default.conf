server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # Never expose dotfiles (.git, .base44, ...) from the bind-mounted repo.
    location ~ /\. {
        deny all;
    }

    # Development serving: always re-read index.html from disk so edits to the
    # cloned source show up immediately on refresh.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
