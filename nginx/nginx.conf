# Dev-only main nginx config for this repo.
#
# Why this file exists: the sandbox checks out the repository root as mode 700
# (root-only), so nginx's stock unprivileged worker ("user nginx;") cannot
# traverse the bind-mounted source and every request 403s. Running the workers
# as root is what makes those files readable here. This is a development
# configuration for serving unbuilt source, not a production one.
user root;

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
